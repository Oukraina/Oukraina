  <script type="module">
    import {presetDelight} from "https://esm.sh/gh/fly1ted/preset-delight"
    import {extractorArbitraryVariants} from 'https://esm.sh/@unocss/extractor-arbitrary-variants@66.0.0'

    window.__unocss = {
      extractorDefault: extractorArbitraryVariants(),
      presets:[
        presetDelight({
          grayHue:50
        })
      ],
      preflights: [
        {
          getCSS: ({ theme:t }) => `
          ::selection{color:${t.c[15]}; background-color:${t.c[0]}}
          ::placeholder{color:${t.c[70]}}
          input,textarea{caret-color: ${t.c[0]};caret-shape:block}

          html{
            background-color: ${t.c[10]};
            color: ${t.c[95]};
            text-size-adjust:100%;
            scroll-behavior:smooth;
            min-height: 100vh;
          }

          body {
            line-height:1.5;
          }

          a:link {color: ${t.c[90]}; text-decoration: none;}
          a:visited {color: ${t.c[90]};}
          a:hover {color: ${t.c.w}; text-decoration: underline;}
          a:active {color: #ff0000;}
          a:focus {outline: 2px solid ${t.c[0]};}

          svg {display: block;max-width: 100%;height: auto;}
          h1,h2,h3,h4,h5,h6{margin: 0;padding: 0;}
          em{background-color: ${t.c[0]};padding-left:0.2em;padding-right:0.2em}
          `
        }
      ],
      theme:{
        a:{
          // https://github.com/unocss/unocss/blob/main/packages-presets/preset-wind4/src/theme/animate.ts
          pulse:'5s ease 0.25s infinite alternate pulse',
          keyframes:{
            'pulse': '{from{transform:scale3d(1,1,1)}50%{transform:scale3d(1.05,1.05,1.05)}to{transform:scale3d(1,1,1)}}',
          }
        },
        c:{
          0:'hsl(50 100% 50%)',
          1:'hsl(212 100% 36%)',
        },
        ff: {
          0: '"Inter", sans-serif',
          1: '"Plus Jakarta Sans", sans-serif'
        }
      },
      shortcuts:[
        {'pny':'pn-a i-50%_auto_auto_auto tf-translateY(-50%)'},
      ]
      // rules: [
      //   [/^m-(.+)$/, ([_, d]) => ({margin: d})]
      //   // custom rules...
      // ],
    //   presets: [
    //     // custom presets...
    //   ],
    //   // ...
    }
  </script>
